<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfbb96">
  <meta name="description" content="Meet your new coffee buddy. A warm cup and a little company at Hero Café.">
  <title>Hero Café — Your new coffee buddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='20' fill='%234b3025'/%3E%3Ctext x='40' y='58' text-anchor='middle' font-size='57' fill='%23f5e9d7' font-family='Georgia'%3Eh%3C/text%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/poster.webp?v=225025">
  <link rel="preload" as="font" href="assets/fonts/Nunito-Variable.woff2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=buddy-1">
</head>
<body>
  <main>
    <section class="hero" id="hero" aria-label="Hero Café interactive scene">
      <div class="scene" id="stage">
        <img class="scene__poster" src="assets/poster.webp?v=225025" alt="A small white rabbit holding a coffee cup, centered on a wooden café counter." fetchpriority="high">
        <canvas id="scene" class="scene__canvas" aria-hidden="true"></canvas>
      </div>
      <header class="mast">
        <a class="brand" href="./" aria-label="Hero Café home">hero<span class="brand__dot">.</span><small>CAFÉ & COMPANY</small></a>
        <span class="mast__note">Made for good mornings.</span>
      </header>

      <div class="copy copy--left">
        <p class="eyebrow">A friendly face. A familiar place.</p>
        <h1>Your new<br><span>coffee buddy.</span></h1>
        <p class="copy__body">A warm cup and a little company.<br>Stay as long as you like.</p>
      </div>

      <button class="primary" id="invite" type="button" disabled>
        <span class="primary__label">Say hello</span>
        <span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
        <span class="primary__liquid" aria-hidden="true"><span>Say hello</span><span class="button-icon"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></span></span>
      </button>

      <aside class="note" aria-label="A welcome from your barista">
        <svg class="note__heart" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 32S6 23 6 14a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 9-14 18-14 18Z"/></svg>
        <p>Big ears.<br>Even bigger heart.</p>
      </aside>

      <details class="interaction" id="interaction" data-ui>
        <summary aria-label="Animation controls">
          <svg class="cursor-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 10-7 1-3 7Z"/></svg>
          <span id="hint">Move your cursor</span>
          <svg class="controls-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/></svg>
        </summary>
        <div class="interaction__panel">
          <div class="modes" role="group" aria-label="Animation interaction">
            <button type="button" data-mode="follow" aria-pressed="true" disabled>Follow</button>
            <button type="button" data-mode="scrub" aria-pressed="false" disabled>Explore</button>
          </div>
          <label class="sr-only" for="timeline">Explore every frame of the animation</label>
          <input id="timeline" class="timeline" type="range" min="0" max="239" step="1" value="114" disabled aria-valuetext="Idle pose">
          <div class="interaction__actions">
            <button id="replay" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"/></svg><span>Play hello</span></button>
            <button id="reset" type="button" disabled>Face forward <span aria-hidden="true">↺</span></button>
          </div>
        </div>
      </details>
      <span class="sr-only" id="status" role="status">Getting ready to say hello…</span>
      <footer class="footer"><span>Good days start here.</span><span>COFFEE & COMPANY</span></footer>
      <noscript><p class="no-script">Enable JavaScript to meet your morning companion.</p></noscript>
    </section>
  </main>
  <script src="frame-store.js?v=strips-1" defer></script>
  <script src="motion-renderer.js?v=strips-1" defer></script>
  <script src="hero.js?v=strips-1" defer></script>
  <script src="controls.js?v=1" defer></script>
</body>
</html>
